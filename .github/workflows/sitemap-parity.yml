name: Sitemap Parity

# Ensures every URL currently listed in the production sitemap is still
# reachable on the Coolify PR preview built from this branch.
#
# Coolify reports preview deployments through a single PR comment per
# application (posted by the Coolify GitHub App and edited in place on every
# deploy), not through commit statuses or the Deployments API. The job polls
# that comment until it reports "ready" with an update newer than the event
# that triggered this run, then checks against the preview URL in the comment.
# If any prod URL is unreachable on the preview, the check fails and blocks
# the merge.

on:
  pull_request:
    branches: ['main']
    
permissions:
  contents: read

concurrency:
  group: sitemap-parity-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Wait for Coolify preview deployment
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Only a comment edited after the push/open that triggered this run
          # can describe this commit's deployment; older ones are stale.
          SINCE: ${{ github.event.pull_request.updated_at }}
          COOLIFY_BOT: openelements-coolify-integration[bot]
          # Name of the Coolify application, as shown in bold in its comment.
          COOLIFY_APP: Open Elements Website
          # Total wait budget in seconds (default 15 min) and poll interval.
          WAIT_TIMEOUT: '900'
          WAIT_INTERVAL: '15'
        run: |
          set -euo pipefail
          echo "Waiting for the Coolify preview of '$COOLIFY_APP' on PR #$PR_NUMBER (updated after $SINCE) ..."

          deadline=$(( $(date +%s) + WAIT_TIMEOUT ))
          preview_url=""

          while [ "$(date +%s)" -lt "$deadline" ]; do
            comment_json=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              | jq -s --arg bot "$COOLIFY_BOT" --arg app "$COOLIFY_APP" '
                  add
                  | map(select(.user.login == $bot and (.body | contains("**" + $app + "**"))))
                  | sort_by(.updated_at) | last // {}')
            updated_at=$(printf '%s' "$comment_json" | jq -r '.updated_at // ""')
            body=$(printf '%s' "$comment_json" | jq -r '.body // ""')

            if [ -z "$updated_at" ]; then
              echo "No Coolify comment yet. Waiting ${WAIT_INTERVAL}s ..."
            elif [[ ! "$updated_at" > "$SINCE" ]]; then
              echo "Coolify comment is from an earlier deployment ($updated_at). Waiting ${WAIT_INTERVAL}s ..."
            elif [[ "$body" == *"is ready."* ]]; then
              preview_url=$(printf '%s' "$body" | sed -n 's/.*\[Open Preview\](\([^)]*\)).*/\1/p' | head -n1)
              if [ -z "$preview_url" ]; then
                echo "::error::Coolify reports ready but the comment has no preview link."
                exit 1
              fi
              echo "Found ready Coolify preview -> $preview_url"
              break
            elif [[ "$body" == *"failed."* ]]; then
              echo "::error::Coolify preview deployment failed for PR #$PR_NUMBER. See the build logs linked in the PR comment."
              exit 1
            else
              echo "Coolify preview is still deploying. Waiting ${WAIT_INTERVAL}s ..."
            fi

            sleep "$WAIT_INTERVAL"
          done

          if [ -z "$preview_url" ]; then
            echo "::error::Timed out after ${WAIT_TIMEOUT}s waiting for the Coolify preview of PR #$PR_NUMBER."
            exit 1
          fi

          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Check sitemap parity
        env:
          PREVIEW_URL: ${{ steps.wait.outputs.preview_url }}
        run: |
          echo "Preview URL: $PREVIEW_URL"
          node scripts/check-sitemap-parity.mjs \
            --prod-base=https://open-elements.com \
            --preview-base="$PREVIEW_URL" \
            --concurrency=4 \
            --retries=4
